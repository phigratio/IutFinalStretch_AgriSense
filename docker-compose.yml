name: iut_ict_fest

services:
  app:
    build:
      context: .
    container_name: iut-ict-fest-backend
    depends_on:
      postgres:
        condition: service_healthy
      mem0-api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iut_ict_fest}:${POSTGRES_PASSWORD:-iut_ict_fest}@postgres:5432/${POSTGRES_DB:-iut_ict_fest}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-docker-auth-token-secret-change-me-32chars}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      FRONTEND_AUTH_SUCCESS_URL: ${FRONTEND_AUTH_SUCCESS_URL:-http://localhost:5173/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      OPENAI_INTAKE_MODEL: ${OPENAI_INTAKE_MODEL:-gpt-4.1-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      MEM0_API_URL: http://mem0-api:8000
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_PERSISTENCE_ENABLED: ${MEM0_PERSISTENCE_ENABLED:-true}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agrisense-cron}
      OTEL_SERVICE_NAME: iut-ict-fest-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL_MS: 5000
      KB_UPLOAD_DIR: /app/uploads/kb
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - kb-uploads:/app/uploads/kb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - observability

  frontend:
    build:
      context: ./frontend
    container_name: iut-ict-fest-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - observability

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iut_ict_fest}
      POSTGRES_USER: ${POSTGRES_USER:-iut_ict_fest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iut_ict_fest}
    ports:
      # Host mapping so the backend can run via `npm run dev` on the host
      # (DATABASE_URL=localhost:5432) instead of inside the compose stack.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - observability

  mem0-api:
    build:
      context: .
      dockerfile: deploy/mem0/Dockerfile
    container_name: mem0-api
    depends_on:
      postgres:
        condition: service_healthy
      mem0-neo4j:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      JWT_SECRET: ${MEM0_JWT_SECRET:-dev-only-change-this-mem0-jwt-secret}
      ADMIN_API_KEY: ${MEM0_API_KEY:-dev-only-mem0-admin-key}
      AUTH_DISABLED: ${MEM0_AUTH_DISABLED:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iut_ict_fest}
      POSTGRES_USER: ${POSTGRES_USER:-iut_ict_fest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iut_ict_fest}
      NEO4J_URI: bolt://mem0-neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${MEM0_NEO4J_PASSWORD:-mem0-password}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:-gpt-4o-mini}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-openai}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-1536}
      PORT: 8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${MEM0_API_PORT:-8889}:8000"
    volumes:
      - mem0-history:/app/history
    networks:
      - observability

  mem0-neo4j:
    image: neo4j:5.26.4
    container_name: mem0-neo4j
    environment:
      NEO4J_AUTH: neo4j/${MEM0_NEO4J_PASSWORD:-mem0-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - mem0-neo4j-data:/data
      - mem0-neo4j-logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - observability

  temporal-postgres:
    image: postgres:16-alpine
    container_name: temporal-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U temporal -d temporal
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - observability

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    networks:
      - observability

  temporal-ui:
    image: temporalio/ui:2.40.1
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    networks:
      - observability

  temporal-worker:
    build:
      context: .
    container_name: temporal-worker
    command: ["sh", "-c", "node scripts/prisma-migrate-deploy.mjs && node dist/temporal/worker.js"]
    depends_on:
      app:
        condition: service_healthy
      temporal:
        condition: service_started
      mem0-api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-iut_ict_fest}:${POSTGRES_PASSWORD:-iut_ict_fest}@postgres:5432/${POSTGRES_DB:-iut_ict_fest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      MEM0_API_URL: http://mem0-api:8000
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_PERSISTENCE_ENABLED: ${MEM0_PERSISTENCE_ENABLED:-true}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agrisense-cron}
      TEMPORAL_ENSURE_SCHEDULES: ${TEMPORAL_ENSURE_SCHEDULES:-true}
    restart: unless-stopped
    networks:
      - observability

  grafana:
    build:
      context: .
      dockerfile: observability/grafana/Dockerfile
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - observability

  prometheus:
    build:
      context: .
      dockerfile: observability/prometheus/Dockerfile
    container_name: prometheus
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability

  loki:
    build:
      context: .
      dockerfile: observability/loki/Dockerfile
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability

  tempo:
    build:
      context: .
      dockerfile: observability/tempo/Dockerfile
    container_name: tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/tmp/tempo
    networks:
      - observability

  otel-collector:
    build:
      context: .
      dockerfile: observability/otel-collector/Dockerfile
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      # Host port must differ from mem0-api's default 8889. Prometheus uses the
      # container-internal otel-collector:8889 address, so only the host side changes.
      - "${OTEL_PROM_EXPORTER_PORT:-8890}:8889"
    networks:
      - observability

networks:
  observability:
    name: observability

volumes:
  tempo-data:
  postgres-data:
  temporal-postgres-data:
  mem0-history:
  mem0-neo4j-data:
  mem0-neo4j-logs:
  kb-uploads:

services:
  app:
    build:
      context: .
    container_name: iut-ict-fest-backend
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iut_ict_fest}:${POSTGRES_PASSWORD:-iut_ict_fest}@postgres:5432/${POSTGRES_DB:-iut_ict_fest}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      FRONTEND_AUTH_SUCCESS_URL: ${FRONTEND_AUTH_SUCCESS_URL:-}
      OTEL_SERVICE_NAME: iut-ict-fest-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL_MS: 5000
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - observability

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iut_ict_fest}
      POSTGRES_USER: ${POSTGRES_USER:-iut_ict_fest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iut_ict_fest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - observability

  grafana:
    build:
      context: .
      dockerfile: observability/grafana/Dockerfile
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - observability

  prometheus:
    build:
      context: .
      dockerfile: observability/prometheus/Dockerfile
    container_name: prometheus
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability

  loki:
    build:
      context: .
      dockerfile: observability/loki/Dockerfile
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability

  tempo:
    build:
      context: .
      dockerfile: observability/tempo/Dockerfile
    container_name: tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/tmp/tempo
    networks:
      - observability

  otel-collector:
    build:
      context: .
      dockerfile: observability/otel-collector/Dockerfile
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROM_EXPORTER_PORT:-8889}:8889"
    networks:
      - observability

networks:
  observability:
    name: observability

volumes:
  tempo-data:
  postgres-data:

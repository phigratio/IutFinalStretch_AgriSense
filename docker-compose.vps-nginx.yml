# VPS overlay for hosts where system Nginx already owns ports 80/443.
#
# Public traffic should terminate in host Nginx, then proxy to these loopback
# ports:
#   frontend: http://127.0.0.1:8095
#   backend:  http://127.0.0.1:8093
#   grafana:  http://127.0.0.1:8094
#   temporal: http://127.0.0.1:8084
#   prometheus: http://127.0.0.1:8087
#   tempo: http://127.0.0.1:8088
#   mem0-api: http://127.0.0.1:8889
#   loki: http://127.0.0.1:3100
#   otel grpc/http/prom: 127.0.0.1:4317 / 4318 / 8890
#   neo4j http/https/bolt: 127.0.0.1:7474 / 7473 / 7687
#   app postgres: 127.0.0.1:55432
#   temporal postgres: 127.0.0.1:55433
#
# Do not combine this file with docker-compose.prod.yml; prod.yml starts Caddy.
services:
  app:
    restart: unless-stopped
    ports: !override
      - "${VPS_APP_BIND:-127.0.0.1}:${VPS_APP_PORT:-8093}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      COOKIE_SECURE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_INTAKE_MODEL: ${OPENAI_INTAKE_MODEL:-gpt-4.1-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      SPEECHMATIC_URL: ${SPEECHMATIC_URL:-https://asr.api.speechmatics.com/v2}
      MEM0_API_URL: http://mem0-api:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?Set MEM0_API_KEY in .env}
      MEM0_PERSISTENCE_ENABLED: ${MEM0_PERSISTENCE_ENABLED:-true}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BDAPPS_APP_ID: ${BDAPPS_APP_ID:-}
      BDAPPS_PASSWORD: ${BDAPPS_PASSWORD:-}
      BDAPPS_APP_NAME: ${BDAPPS_APP_NAME:-AgriSense}
      BDAPPS_BASE_URL: ${BDAPPS_BASE_URL:-https://developer.bdapps.com}
      BDAPPS_KNOWN_SUBSCRIBERS: ${BDAPPS_KNOWN_SUBSCRIBERS:-}
      MOCK_BDAPPS: ${MOCK_BDAPPS:-}
      MOCK_BDAPPS_BALANCE: ${MOCK_BDAPPS_BALANCE:-100}

  frontend:
    restart: unless-stopped
    ports: !override
      - "${VPS_FRONTEND_BIND:-127.0.0.1}:${VPS_FRONTEND_PORT:-8095}:80"

  postgres:
    restart: unless-stopped
    ports: !override
      - "${VPS_POSTGRES_BIND:-0.0.0.0}:${VPS_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  mem0-api:
    restart: unless-stopped
    ports: !override
      - "${VPS_MEM0_API_BIND:-0.0.0.0}:${VPS_MEM0_API_PORT:-8889}:8000"
    environment:
      AUTH_DISABLED: ${MEM0_AUTH_DISABLED:-false}
      JWT_SECRET: ${MEM0_JWT_SECRET:?Set MEM0_JWT_SECRET in .env}
      ADMIN_API_KEY: ${MEM0_API_KEY:?Set MEM0_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}

  mem0-neo4j:
    restart: unless-stopped
    ports: !override
      - "${VPS_MEM0_NEO4J_HTTP_BIND:-0.0.0.0}:${VPS_MEM0_NEO4J_HTTP_PORT:-7474}:7474"
      - "${VPS_MEM0_NEO4J_HTTPS_BIND:-0.0.0.0}:${VPS_MEM0_NEO4J_HTTPS_PORT:-7473}:7473"
      - "${VPS_MEM0_NEO4J_BOLT_BIND:-0.0.0.0}:${VPS_MEM0_NEO4J_BOLT_PORT:-7687}:7687"

  temporal-postgres:
    restart: unless-stopped
    ports: !override
      - "${VPS_TEMPORAL_POSTGRES_BIND:-0.0.0.0}:${VPS_TEMPORAL_POSTGRES_PORT:-55433}:5432"

  temporal:
    restart: unless-stopped
    ports: !override
      - "${VPS_TEMPORAL_GRPC_BIND:-0.0.0.0}:${VPS_TEMPORAL_GRPC_PORT:-7233}:7233"

  temporal-ui:
    restart: unless-stopped
    ports: !override
      - "${VPS_TEMPORAL_UI_BIND:-0.0.0.0}:${VPS_TEMPORAL_UI_PORT:-8084}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-https://${PUBLIC_HOST}}

  temporal-worker:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      SPEECHMATIC_URL: ${SPEECHMATIC_URL:-https://asr.api.speechmatics.com/v2}
      MEM0_API_URL: http://mem0-api:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?Set MEM0_API_KEY in .env}
      MEM0_PERSISTENCE_ENABLED: ${MEM0_PERSISTENCE_ENABLED:-true}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agrisense-cron}
      TEMPORAL_ENSURE_SCHEDULES: ${TEMPORAL_ENSURE_SCHEDULES:-true}
      BDAPPS_APP_ID: ${BDAPPS_APP_ID:-}
      BDAPPS_PASSWORD: ${BDAPPS_PASSWORD:-}
      BDAPPS_APP_NAME: ${BDAPPS_APP_NAME:-AgriSense}
      BDAPPS_BASE_URL: ${BDAPPS_BASE_URL:-https://developer.bdapps.com}
      BDAPPS_KNOWN_SUBSCRIBERS: ${BDAPPS_KNOWN_SUBSCRIBERS:-}
      MOCK_BDAPPS: ${MOCK_BDAPPS:-}
      MOCK_BDAPPS_BALANCE: ${MOCK_BDAPPS_BALANCE:-100}

  grafana:
    restart: unless-stopped
    ports: !override
      - "${VPS_GRAFANA_BIND:-127.0.0.1}:${VPS_GRAFANA_PORT:-8094}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${PUBLIC_HOST}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-true}

  prometheus:
    restart: unless-stopped
    ports: !override
      - "${VPS_PROMETHEUS_BIND:-0.0.0.0}:${VPS_PROMETHEUS_PORT:-8087}:9090"

  loki:
    restart: unless-stopped
    ports: !override
      - "${VPS_LOKI_BIND:-0.0.0.0}:${VPS_LOKI_PORT:-3100}:3100"

  tempo:
    restart: unless-stopped
    ports: !override
      - "${VPS_TEMPO_BIND:-0.0.0.0}:${VPS_TEMPO_PORT:-8088}:3200"

  otel-collector:
    restart: unless-stopped
    ports: !override
      - "${VPS_OTEL_GRPC_BIND:-0.0.0.0}:${VPS_OTEL_GRPC_PORT:-4317}:4317"
      - "${VPS_OTEL_HTTP_BIND:-0.0.0.0}:${VPS_OTEL_HTTP_PORT:-4318}:4318"
      - "${VPS_OTEL_PROM_BIND:-0.0.0.0}:${VPS_OTEL_PROM_PORT:-8890}:8889"

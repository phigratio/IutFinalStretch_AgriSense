services:
  proxy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    container_name: iut-ict-fest-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      grafana:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - observability

  app:
    restart: unless-stopped
    ports: !override []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://${PUBLIC_HOST}/auth/google/callback
      FRONTEND_AUTH_SUCCESS_URL: ${FRONTEND_AUTH_SUCCESS_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      SPEECHMATIC_URL: ${SPEECHMATIC_URL:-https://asr.api.speechmatics.com/v2}
      MEM0_API_URL: http://mem0-api:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?Set MEM0_API_KEY in .env}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BDAPPS_APP_ID: ${BDAPPS_APP_ID:-}
      BDAPPS_PASSWORD: ${BDAPPS_PASSWORD:-}
      BDAPPS_APP_NAME: ${BDAPPS_APP_NAME:-AgriSense}
      BDAPPS_BASE_URL: ${BDAPPS_BASE_URL:-https://developer.bdapps.com}
      BDAPPS_KNOWN_SUBSCRIBERS: ${BDAPPS_KNOWN_SUBSCRIBERS:-}
      MOCK_BDAPPS: ${MOCK_BDAPPS:-}
      MOCK_BDAPPS_BALANCE: ${MOCK_BDAPPS_BALANCE:-100}

  frontend:
    restart: unless-stopped
    ports: !override []

  grafana:
    restart: unless-stopped
    ports: !override []
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  prometheus:
    restart: unless-stopped
    ports: !override []

  postgres:
    restart: unless-stopped
    ports: !override []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  mem0-api:
    restart: unless-stopped
    ports: !override []
    environment:
      AUTH_DISABLED: "false"
      JWT_SECRET: ${MEM0_JWT_SECRET:?Set MEM0_JWT_SECRET in .env}
      ADMIN_API_KEY: ${MEM0_API_KEY:?Set MEM0_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}

  temporal-worker:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      SPEECHMATIC_API_KEY: ${SPEECHMATIC_API_KEY:-}
      SPEECHMATIC_URL: ${SPEECHMATIC_URL:-https://asr.api.speechmatics.com/v2}
      BDAPPS_APP_ID: ${BDAPPS_APP_ID:-}
      BDAPPS_PASSWORD: ${BDAPPS_PASSWORD:-}
      BDAPPS_APP_NAME: ${BDAPPS_APP_NAME:-AgriSense}
      BDAPPS_BASE_URL: ${BDAPPS_BASE_URL:-https://developer.bdapps.com}
      BDAPPS_KNOWN_SUBSCRIBERS: ${BDAPPS_KNOWN_SUBSCRIBERS:-}
      MOCK_BDAPPS: ${MOCK_BDAPPS:-}
      MOCK_BDAPPS_BALANCE: ${MOCK_BDAPPS_BALANCE:-100}

  mem0-neo4j:
    restart: unless-stopped

  temporal:
    restart: unless-stopped
    ports: !override []

  temporal-ui:
    restart: unless-stopped
    ports: !override []

  loki:
    restart: unless-stopped
    ports: !override []

  tempo:
    restart: unless-stopped
    ports: !override []

  otel-collector:
    restart: unless-stopped
    ports: !override []

volumes:
  caddy-data:
  caddy-config:
